    <!-- НИЗ — резюме и контакты одной группой, одинаково на обеих страницах.
         Подпись «Linkedin» — как на макете 2026-10-12. -->
    <div class="rail__foot">
      <div class="act">
        <a class="act__cv" href="https://codedesign.ru/CV.pdf" target="_blank" rel="noopener">Резюме — PDF</a>
      </div>
      <div class="hire">
        <div class="hire__links">
          <a href="https://t.me/zador_ka" target="_blank" rel="noopener">Telegram</a>
          <a href="https://www.linkedin.com/in/zadorozhnayaekaterina/" target="_blank" rel="noopener">Linkedin</a>
        </div>
      </div>
      <button class="prefs__theme" type="button" aria-pressed="false" aria-label="Тёмная тема">
        <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 .75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
    <script>
    (function(){
      var root=document.documentElement, btns=document.querySelectorAll('.prefs__theme');
      if(!btns.length) return;
      function current(){ return root.getAttribute('data-theme')==='dark'?'dark':'light'; }
      function sync(){ var d=current()==='dark';
        btns.forEach(function(b){
          b.setAttribute('aria-pressed', d?'true':'false');
          b.setAttribute('aria-label', d?'Светлая тема':'Тёмная тема'); }); }
      sync();
      btns.forEach(function(b){ b.addEventListener('click', function(){
        var next = current()==='dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try{ localStorage.setItem('theme', next); }catch(e){}
        sync();
      }); });
    })();
    </script>
